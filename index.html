<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d6b3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="A family game. A small 3D platformer about a ruined city and friends to bring home." />
    <title>Mario and the Forgotten Land</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app" data-mode="title">
      <canvas id="view"></canvas>
      <div id="pointer-layer"></div>
      <div id="hurt"></div>
      <header id="hud">
        <div id="hearts" aria-hidden="true"></div>
        <div id="stats">
          <div class="pill"><span class="coin-dot"></span><span id="coin-count">0</span></div>
          <div class="pill"><span class="friend-dot"></span><span id="friend-count">0</span></div>
          <div id="power-pill" hidden></div>
        </div>
        <div id="hud-buttons">
          <button id="btn-mute" class="hud-btn" type="button">MUTE</button>
          <button id="btn-full" class="hud-btn" type="button">FULL</button>
          <button id="btn-pause" class="hud-btn" type="button">PAUSE</button>
        </div>
      </header>
      <div id="boss-wrap" hidden>
        <div id="boss-name">Turtle King</div>
        <div id="boss-bar"><div id="boss-fill"></div></div>
      </div>
      <div id="banner"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="prompt"></div>
      <div id="touch">
        <div id="stick" aria-hidden="true"><div id="knob"></div></div>
        <div id="actions">
          <button id="btn-inhale" type="button">INHALE<small>ACTION</small></button>
          <button id="btn-attack" type="button">ATTACK<small>POWER</small></button>
          <button id="btn-jump" type="button">JUMP</button>
        </div>
      </div>
      <section id="title" class="screen">
        <div class="title-card">
          <div class="title-copy">
            <p class="eyebrow">A family game</p>
            <h1>Mario and the<br />Forgotten Land</h1>
            <ul class="help">
              <li>Stick moves. JUMP, then jump again to flutter.</li>
              <li>Land on enemies, or press ATTACK.</li>
              <li>Hold INHALE to pull. Press it beside a cone or car.</li>
            </ul>
          </div>
          <button id="btn-play" type="button">PLAY</button>
        </div>
      </section>
      <section id="pause" class="screen" hidden>
        <div class="panel">
          <p class="eyebrow">A family game</p>
          <h2>Paused</h2>
          <button id="btn-resume" type="button">RESUME</button>
          <button id="btn-pause-mute" type="button">MUTE</button>
          <button id="btn-town" type="button">BACK TO TOWN</button>
        </div>
      </section>
      <section id="results" class="screen" hidden>
        <div class="panel">
          <h2 id="results-title">Clear!</h2>
          <p id="results-sub"></p>
          <div id="results-toads"></div>
          <p id="results-coins"></p>
          <p id="results-time"></p>
          <button id="btn-results-ok" type="button">BACK TO TOWN</button>
        </div>
      </section>
      <div id="rotate">
        <div class="phone"></div>
        <p>Turn your phone sideways</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
